spring.application.name=backend

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/laundry_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Admin
# ===============================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:$2a$10$7EqJtq98hPqEX7fNZaFWoO5uC6pQm0fY7L3FUzI4rVtR05Q.8vN6.}

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:change-this-development-secret-before-production-123456}
app.jwt.expiration=PT1H

# ===============================
# Server
# ===============================
server.port=8080